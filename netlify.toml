[build]
  publish = "."

[[redirects]]
  from = "https://give.cclbparish.com/*"
  to = "https://cclbparish.com/give/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://harvest.cclbparish.com/*"
  to = "https://cclbparish.com/harvest/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://join.cclbparish.com/*"
  to = "https://cclbparish.com/join/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https://images.unsplash.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://tally.so https://*.tally.so; connect-src 'self' https://tally.so https://*.tally.so; frame-src https://www.youtube.com https://player.vimeo.com https://tally.so https://*.tally.so; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https://images.unsplash.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://tally.so https://*.tally.so; connect-src 'self' blob: https://auth.decapbridge.com https://gateway.decapbridge.com https://www.netlifystatus.com https://tally.so https://*.tally.so; frame-src https://www.youtube.com https://player.vimeo.com https://tally.so https://*.tally.so; form-action 'self'; upgrade-insecure-requests"

