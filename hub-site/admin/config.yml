# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: Paul-Nwokolo/CCLB
  branch: main
  identity_url: https://auth.decapbridge.com/sites/8e64f292-7c37-4647-95d6-393f70b3cacd
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://cclbparish.com

media_folder: "hub-site/images/gallery"
public_folder: "images/gallery"

collections:
  - name: "content"
    label: "Content Management"
    files:
      - file: "hub-site/data/gallery.json"
        label: "Photo Gallery"
        name: "gallery"
        fields:
          - label: "Gallery Slides"
            name: "items"
            widget: "list"
            fields:
              - label: "Image"
                name: "image"
                widget: "image"
                required: false
                hint: "Upload a photo for this slide."
              - label: "Video Embed URL"
                name: "video"
                widget: "string"
                required: false
                hint: "Optional: Paste a YouTube/Vimeo embed URL (e.g. https://www.youtube.com/embed/...). This overrides the Image if provided. Do NOT upload video files."
              - label: "Alt Text"
                name: "alt"
                widget: "string"
                required: true
                hint: "Describe the image or video for screen readers."
